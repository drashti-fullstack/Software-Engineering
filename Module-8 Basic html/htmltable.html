<!-- Task: Create a product catalog table that includes the following columns:
o Product Name
o Product Image (use placeholder image URLs)
o Price
o Description
o Availability (in stock, out of stock)
Additional Requirements:
o Use thead for the table header.
o Add a border and some basic styling using inline CSS.
o Use colspan or rowspan to merge cells where applicable -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>

    <table border="1" align="center" style="width: 80%; text-align: center;">
        <thead style="background-color: lightcoral;">
            <tr>
                <th>Product Name</th>
                <th>Product Image</th>
                <th>Price</th>
                <th>Description</th>
                <th>Availability</th>
            </tr>
        </thead>
        <tbody style="background-color: lightgoldenrodyellow;">
            <tr>

                <td>50&#8377;</td>

            </tr>
            <tr>

                <td><img src="https://www.havmor.com/sites/default/files/styles/502x375/public/gallery/choclate-chips_0.jpg?itok=jeaFOwBl" alt="Product 2" height="100px"></td>
                <td>75&#8377;</td>
                <td>220gm</td>
                <td>In stock</td>
            </tr>
            <tr>
                <td>American Nuts</td>

            <tr>

</body>
</html>
